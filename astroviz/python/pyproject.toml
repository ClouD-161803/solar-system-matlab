[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroviz"
version = "0.0.1"
description = "Visualization layer for astrodynamics data: binary container export and self-contained HTML animations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Only the stand-in ER3BP propagator used by the example needs scipy.
example = ["scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
astroviz = ["template.html"]
