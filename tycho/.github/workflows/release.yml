# Publishes pytycho to PyPI and npm when a GitHub release is published (tag vX.Y.Z).
# PyPI uses Trusted Publishing (no token); npm uses the NPM_TOKEN secret.
name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build the runtime
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/pytycho/__init__.py').read()).group(1))")
          js=$(node -p "require('./web/package.json').version")
          echo "tag=$tag py=$py js=$js"
          test "$tag" = "$py" && test "$tag" = "$js"
      - name: Build Python distributions
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/
      - name: Publish
        working-directory: web
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
