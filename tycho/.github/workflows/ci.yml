name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and typecheck the runtime
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test pytycho
        run: |
          pip install -e ".[test]"
          pytest -q
      - name: Wheel includes the runtime
        run: |
          pip install build
          python -m build --wheel
          unzip -l dist/*.whl | grep -q "pytycho/_static/tycho.js"
